# Manual database preflight.
#
# Why a separate workflow instead of a step in CI: the nightly fixture-ingest is the only DB-touching
# step in the whole pipeline, it has failed every night since it was introduced (2026-07-21), and the
# only way to test a fix was to wait for 03:00. Adding it to `ci.yml` was rejected on purpose — `verify`
# is the required check for merging, and a manual run that skips the paid eval must never be able to
# produce a green `verify` for a commit. A differently-named job cannot be mistaken for the gate.
#
# Cheap by construction: no LLM calls. It runs the real nightly command, which is idempotent and a
# no-op once the fixtures are in place, so a healthy database answers with "Fixtures unchanged".
name: DB preflight

on:
  workflow_dispatch:

jobs:
  db-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prints a target fingerprint (never the host, user or database name — this repo is public) and,
      # on failure, the driver's own `code`/`cause` instead of an empty message. Compare the fingerprint
      # against a local `pnpm --filter @wunderstack/ingest ingest:fixtures` to tell "wrong database"
      # apart from "cannot connect to the right one".
      - name: Ingest golden fixtures (same command as the nightly)
        run: pnpm --filter @wunderstack/ingest ingest:fixtures
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
