name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs inside the merge queue: this is where Gate B/C become truly required before landing on
  # main. Enable in branch protection: require the "verify" check + turn on the merge queue.
  merge_group:
  # Nightly answer-quality trend (Gate C with more judge samples), off the PR hot path.
  schedule:
    - cron: "0 3 * * *"
  # Manual baseline refresh: writes fixtures/baseline.json under nightly config and uploads it as an
  # artifact. Commit stays manual on purpose — baselines are reviewed, never auto-committed.
  # `run_db_gates` instead runs the nightly DB-backed gates on demand: they had failed eleven nights
  # unnoticed (docs/audit/FINDING-nightly-db-gate-never-ran-2026-07-31.md), and a change to that path
  # you can only observe at 03:00 is a change you cannot verify.
  workflow_dispatch:
    inputs:
      run_db_gates:
        description: "Run the nightly DB-backed gates now instead of refreshing the baseline"
        type: boolean
        default: false

# The eval shares one Mistral rate limit, and two full runs at judge 3 do not fit inside it: on
# 2026-07-31 a push run on main (41 min, all gates green so far) died on a 429 while a dispatched run
# overlapped it for 19 minutes. The eval already refuses to run twice on one machine (eval-lock.ts);
# this is that same property across runners. The paid paths therefore queue behind each other, while
# each PR ref keeps its own group and cancels its own superseded runs.
# Caveat: with three or more paid runs waiting, GitHub cancels the older pending one, so a push could
# land without a verdict. Accepted for now — pushes to main are rare and a cancelled run is visible,
# unlike the 429 it replaces.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || 'ci-eval-paid' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # workflow_dispatch is baseline-only (see write-baseline below), except when it is explicitly asked
    # to exercise the DB gates; skip the paid verify eval otherwise.
    if: github.event_name != 'workflow_dispatch' || inputs.run_db_gates == true
    runs-on: ubuntu-latest
    env:
      # Ephemeral, local, thrown away with the runner — so these credentials are not a secret.
      GATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wunderstack
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the merge-base for path-filtered GATE_DB on pull_request.
          fetch-depth: 0

      - name: Resolve GATE_DB
        # Nightly / dispatch always. On PRs: only when the diff touches packages that can break
        # corpus isolation (db / rag / tenant) — starts pgvector, not the 25-min LLM answer gate.
        id: gate_db
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.run_db_gates }}" = "true" ]; then
            echo "GATE_DB=true" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            if git diff --name-only "$BASE...$HEAD" | grep -E '^packages/(db|rag|tenant)/' >/dev/null; then
              echo "GATE_DB=true" >> "$GITHUB_ENV"
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "PR touches packages/db|rag|tenant — enabling gate database for G3-isolation"
              exit 0
            fi
          fi
          echo "GATE_DB=false" >> "$GITHUB_ENV"
          echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Depcruise (arrow rule)
        run: pnpm depcruise

      - name: UI boundaries
        run: pnpm check-ui-boundaries

      - name: Motion tokens
        run: pnpm check-motion

      - name: Database GRANT TO PUBLIC
        run: pnpm check-grants

      # Fast, offline unit tests
      - name: Unit tests
        run: pnpm turbo run test:unit

      # The DB-backed gates (Gate B-integration, Gate D integration, G3-fund) need Postgres + pgvector.
      # We start a throwaway one here rather than pointing at the managed staging database, because:
      #   - the gate then measures only what this commit declares. A shared database carries leftovers
      #     from earlier runs and from local work, and a gate that reads stale rows can be green for
      #     reasons the commit does not contain.
      #   - CI needs no DATABASE_URL secret and the managed database needs no public reachability.
      # A `services:` block would start a container on every PR run too; `docker run` behind a condition
      # keeps the PR path free. pgvector is pinned to the version in .cursor/rules/100-stack.mdc; the
      # Postgres major is our choice here, so both versions are printed to make drift against Scalingo
      # visible. This database holds public AVV-CAO text and synthetic fixtures only — real fund data
      # must never be ingested on a runner outside the EU (000-core.mdc).
      - name: Start gate database (Postgres + pgvector)
        if: env.GATE_DB == 'true'
        run: |
          docker run -d --name gate-db \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=wunderstack \
            -p 5432:5432 \
            pgvector/pgvector:0.8.2-pg17
          for _ in $(seq 1 30); do
            docker exec gate-db pg_isready -U postgres -d wunderstack >/dev/null 2>&1 && break
            sleep 2
          done
          # Unsuppressed, so an unreachable database fails here instead of inside a query.
          docker exec gate-db pg_isready -U postgres -d wunderstack
          docker exec gate-db psql -U postgres -d wunderstack -tAc "select version();"

      - name: Migrate gate database
        if: env.GATE_DB == 'true'
        run: |
          pnpm --filter @wunderstack/db db:migrate
          pnpm --filter @wunderstack/db-scripts migrate-fund-schemas
          docker exec gate-db psql -U postgres -d wunderstack -tAc \
            "select 'pgvector ' || extversion from pg_extension where extname = 'vector';"
        env:
          DATABASE_URL: ${{ env.GATE_DATABASE_URL }}

      # Fund-environment seam (createFundEnvironment atomicity + analytics against a real schema).
      # PROVISIONER_DATABASE_URL has no fallback — point it at the same throwaway gate DB.
      - name: Fund environment integration
        if: env.GATE_DB == 'true'
        # A test file that leaves a postgres.js pool open never exits; without this the run
        # burns the six-hour job limit instead of reporting a failure.
        timeout-minutes: 10
        run: |
          pnpm --filter @wunderstack/db test:unit
          pnpm --filter @wunderstack/analytics test:unit
        env:
          DATABASE_URL: ${{ env.GATE_DATABASE_URL }}
          PROVISIONER_DATABASE_URL: ${{ env.GATE_DATABASE_URL }}

      # Ingest every corpus the gates score against, from the repo, into the fresh database. All five
      # sources are committed, so the gate's input is fully declared by this commit:
      #   eval-fixtures  <- fixtures/golden-passages.jsonl (base layer + fund set "etd")
      #   demo           <- scripts/ingest/demo-corpus/cao-fictief.md (fund set "demo")
      #   arbo-corpus    <- scripts/ingest/arbo-corpus/arbo-fictief.md (same fund, agent_key arbo;
      #                     G3-isolation needs a second agent on an ingested fund)
      #   arbo-oomt      <- scripts/ingest/arbo-oomt/arbo_catalogus_oomt.pdf (fund set "arbo.oomt")
      #   elektronische-detailhandel <- scripts/ingest/input/cao_elektronische_detailhandel.pdf
      #                                 (fund set "etd-full"). A FILE, not the directory: `ingest <dir>`
      #                                 takes every supported file in it, and a second CAO dropped in
      #                                 that folder silently joined this fund (hit@1 92.9% → 64.3%, 2026-08-24).
      - name: Ingest gate corpora
        if: env.GATE_DB == 'true'
        run: |
          pnpm --filter @wunderstack/ingest ingest:fixtures
          pnpm --filter @wunderstack/ingest ingest demo-corpus --fund demo --agent cao --version 1 --prune
          pnpm --filter @wunderstack/ingest ingest arbo-corpus --fund demo --agent arbo --version 1 --prune
          pnpm --filter @wunderstack/ingest ingest arbo-oomt --fund oomt --agent arbo --version arbo-oomt-2 --prune
          pnpm --filter @wunderstack/ingest ingest input/cao_elektronische_detailhandel.pdf \
            --fund elektronische-detailhandel --agent cao --version 1 --prune
        env:
          DATABASE_URL: ${{ env.GATE_DATABASE_URL }}
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}

      # Quality gate: blocks prompt/retrieval/answer regressions (Fase 9).
      # SCALEWAY_API_KEY enables Gate B (retrieval + rerank); MISTRAL_API_KEY enables Gate C
      # (answer-level LLM-judge). On fork PRs without secrets, Gate A still runs and B/C skip.
      # EVAL_REQUIRE_ALL turns a skip into a FAIL when landing on main (merge queue), on the
      # protected branch, or nightly — so "skipped != passed". EVAL_JUDGE_SAMPLES=3 on
      # merge/push/nightly (Tier B); PRs keep 1 to stay cheap. EVAL_GENERATION_SAMPLES=3 wherever
      # the answer gate is REQUIRED (same condition as EVAL_REQUIRE_ALL, incl. same-repo PRs):
      # best-of-N is the sanctioned lever against single-sample variance on the zero-tolerance count
      # gates (citation-verification, dangling-marker), which are judge-INDEPENDENT so more judge
      # samples cannot help them — see packages/agents/src/evals/cao.eval.ts.
      - name: Eval (accuracy gate)
        run: pnpm turbo run test
        env:
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # DB-backed gates (Gate B-integration, Gate D integration, G3-fund) run only where the gate
          # database was brought up above: nightly, or a dispatch that asked for it. PRs run with no
          # DATABASE_URL and those gates skip. EVAL_REQUIRE_DB makes them required (fail-if-missing)
          # there, so a database that never came up cannot pass as a skip.
          DATABASE_URL: ${{ env.GATE_DB == 'true' && env.GATE_DATABASE_URL || '' }}
          EVAL_REQUIRE_DB: ${{ env.GATE_DB == 'true' && '1' || '0' }}
          # Same-repo PRs have secrets, so a missing/expired key must FAIL rather than silently pass
          # with only Gate A + D-contract. Fork PRs (head repo != this repo) have no secrets and keep
          # skipping B/C. See audit point #13.
          EVAL_REQUIRE_ALL: ${{ (github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && '1' || '0' }}
          # Median over 3 samples damps single-draw judge noise on the merge/nightly path (Tier B).
          # PRs keep 1 to keep the hot path cheap; write-baseline also uses 3 (see below).
          EVAL_JUDGE_SAMPLES: ${{ (github.event_name == 'schedule' || github.event_name == 'merge_group' || github.event_name == 'push') && '3' || '1' }}
          # Best-of-N generation attempts per Gate C case. Set to 3 exactly where the answer gate is
          # required (mirrors EVAL_REQUIRE_ALL, incl. same-repo PRs) to tame single-sample variance on
          # the count-based citation-verification / dangling gates; explicit 2 (= production default)
          # on cheap/fork paths where B/C skip. write-baseline also uses 3 (see below).
          EVAL_GENERATION_SAMPLES: ${{ (github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && '3' || '2' }}

      # Per-run artefact (E9): commit SHA, model ids, per-case scores, aggregates, gate results,
      # rerank counts, judge parse-retries. Uploaded even on failure — a red run is when it matters.
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: packages/agents/eval-report.json
          if-no-files-found: warn

      # Promotion ledger check (offline): may this fund be promoted at HEAD? Reads the ledger the
      # eval just appended and the structure reports ingest just wrote. A NO-GO is the signal —
      # including "ledger still empty for this fund" — not a skip.
      - name: Promote-check (nightly / GATE_DB)
        if: success() && env.GATE_DB == 'true'
        run: |
          set -euo pipefail
          for fund in demo etd etd-full oomt; do
            echo "::group::promote-check $fund HEAD"
            pnpm promote-check "$fund" HEAD || exit 1
            echo "::endgroup::"
          done

  # Manual-only: refresh the recorded baseline (retrieval + answer) under nightly config and publish
  # it as an artifact for review. Never commits — a human downloads it, inspects the deltas, and
  # commits it with the measured values in the message (Fase E7). Median over EVAL_JUDGE_SAMPLES=3
  # damps single-sample judge noise in the recorded numbers.
  write-baseline:
    # A dispatch that asked for the DB gates is not a baseline refresh; do not spend a second eval on it.
    if: github.event_name == 'workflow_dispatch' && inputs.run_db_gates != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write baseline (nightly config)
        run: pnpm turbo run test
        env:
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          EVAL_WRITE_BASELINE: "1"
          EVAL_JUDGE_SAMPLES: "3"
          # Record the baseline under the same best-of-N regime the required paths run (see verify job),
          # so the regression reference is apples-to-apples with merge/push/nightly and same-repo PRs.
          EVAL_GENERATION_SAMPLES: "3"

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-baseline
          path: packages/agents/src/evals/fixtures/baseline.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-baseline
          path: packages/agents/eval-report.json
          if-no-files-found: warn
