name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs inside the merge queue: this is where Gate B/C become truly required before landing on
  # main. Enable in branch protection: require the "verify" check + turn on the merge queue.
  merge_group:
  # Nightly answer-quality trend (Gate C with more judge samples), off the PR hot path.
  schedule:
    - cron: "0 3 * * *"
  # Manual baseline refresh: writes fixtures/baseline.json under nightly config and uploads it as an
  # artifact. Commit stays manual on purpose — baselines are reviewed, never auto-committed.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Depcruise (arrow rule)
        run: pnpm depcruise

      # Fast, offline unit tests (no API keys): parse/retry contracts and other pure logic.
      - name: Unit tests
        run: pnpm turbo run test:unit

      # Quality gate: blocks prompt/retrieval/answer regressions (Fase 9).
      # SCALEWAY_API_KEY enables Gate B (retrieval + rerank); MISTRAL_API_KEY enables Gate C
      # (answer-level LLM-judge). On fork PRs without secrets, Gate A still runs and B/C skip.
      # EVAL_REQUIRE_ALL turns a skip into a FAIL when landing on main (merge queue), on the
      # protected branch, or nightly — so "skipped != passed". EVAL_JUDGE_SAMPLES=3 nightly.
      # See packages/agents/src/evals/cao.eval.ts.
      - name: Eval (accuracy gate)
        run: pnpm turbo run test
        env:
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          EVAL_REQUIRE_ALL: ${{ (github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'schedule') && '1' || '0' }}
          EVAL_JUDGE_SAMPLES: ${{ github.event_name == 'schedule' && '3' || '1' }}

  # Manual-only: refresh the recorded baseline (retrieval + answer) under nightly config and publish
  # it as an artifact for review. Never commits — a human downloads it, inspects the deltas, and
  # commits it with the measured values in the message (Fase E7). Median over EVAL_JUDGE_SAMPLES=3
  # damps single-sample judge noise in the recorded numbers.
  write-baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write baseline (nightly config)
        run: pnpm turbo run test
        env:
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          EVAL_WRITE_BASELINE: "1"
          EVAL_JUDGE_SAMPLES: "3"

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-baseline
          path: packages/agents/src/evals/fixtures/baseline.json
