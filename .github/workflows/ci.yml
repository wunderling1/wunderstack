name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Depcruise (arrow rule)
        run: pnpm depcruise

      # Quality gate: blocks prompt/retrieval/answer regressions (Fase 9).
      # SCALEWAY_API_KEY enables Gate B (retrieval + rerank); MISTRAL_API_KEY enables Gate C
      # (answer-level LLM-judge). On forks without secrets, Gate A still runs.
      # See packages/agents/src/evals/cao.eval.ts.
      - name: Eval (accuracy gate)
        run: pnpm turbo run test
        env:
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
