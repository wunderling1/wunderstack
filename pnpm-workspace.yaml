packages:
  - "apps/*"
  - "packages/*"
  - "scripts/*"

# Don't auto-run `pnpm install` before every `pnpm run` script. pnpm's pre-run check treats the
# not-yet-executed native build scripts below as "out of sync" and then aborts on the ignored-builds
# gate, which blocks every workspace script (e.g. `sync-model-prices`, `smoke`). Run `pnpm install`
# explicitly when dependencies change.
verifyDepsBeforeRun: false

# Approve native build scripts (pnpm 11+ requires allowBuilds; onlyBuiltDependencies is ignored).
# - sharp: Next.js image-optimization dependency (prebuilt binaries).
# - esbuild: used by drizzle-kit to load the TypeScript schema; needs its native binary.
# - protobufjs: pulled in transitively by Mastra's gRPC/OpenTelemetry stack (@wunderstack/agents).
allowBuilds:
  sharp: true
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@next/env@16.3.4'
  - '@next/swc-darwin-arm64@16.3.4'
  - '@next/swc-darwin-x64@16.3.4'
  - '@next/swc-linux-arm64-gnu@16.3.4'
  - '@next/swc-linux-arm64-musl@16.3.4'
  - '@next/swc-linux-x64-gnu@16.3.4'
  - '@next/swc-linux-x64-musl@16.3.4'
  - '@next/swc-win32-arm64-msvc@16.3.4'
  - '@next/swc-win32-x64-msvc@16.3.4'
  - next@16.3.4
